# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - shopdemo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        env:
          NODE_ENV: production
          VITE_APP_SECRET: ${{ secrets.VITE_APP_SECRET }}
        run: |
          npm install --include=dev
          NODE_ENV=production npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Set startup command via Kudu API
        run: |
          curl -s -X POST \
            -u "${{ secrets.AZURE_KUDU_USER }}:${{ secrets.AZURE_KUDU_PASS }}" \
            -H "Content-Type: application/json" \
            -d '{"startupCommand":"node server.js"}' \
            "https://shopdemo-e3gwg9hqaygghmbv.scm.canadacentral-01.azurewebsites.net/api/settings"

      - name: Zip and deploy via Kudu ZipDeploy
        run: |
          zip -r app.zip . \
            --exclude "*.git*" \
            --exclude "*.github*" \
            --exclude "automation/*" \
            --exclude "logs*" \
            --exclude "*.zip"
          curl -s -X POST \
            -u "${{ secrets.AZURE_KUDU_USER }}:${{ secrets.AZURE_KUDU_PASS }}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            "https://shopdemo-e3gwg9hqaygghmbv.scm.canadacentral-01.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -w "\nHTTP Status: %{http_code}\n"
          